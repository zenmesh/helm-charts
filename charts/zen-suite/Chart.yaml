apiVersion: v2
name: zen-suite
description: Umbrella chart for Zen Mesh component charts - zen-lock, zen-flow and zen-gc in one release
type: application
version: 0.0.3-alpha
appVersion: "0.0.2-alpha"

keywords:
  - kubernetes
  - zen-mesh
  - security
  - workflow
  - operator
  - suite

home: https://github.com/zenmesh/helm-charts
sources:
  - https://github.com/zenmesh/helm-charts

maintainers:
  - name: Zen Mesh Team
    email: zen@zen-mesh.io

annotations:
  category: Integration
  artifacthub.io/changes: |
    - Initial release
    - Umbrella chart for zen-lock, zen-flow, and zen-gc
    - 0.0.3-alpha removes zen-watcher and zen-lead (proprietary components, no longer published)
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/zenmesh/helm-charts/blob/main/docs/INSTALL.md
    - name: Source
      url: https://github.com/zenmesh/helm-charts
    - name: Support
      url: https://github.com/zenmesh/helm-charts/issues

dependencies:
  - name: zen-lock
    version: "0.0.4-alpha"
    repository: "file://../zen-lock"
    condition: zenLock.enabled
  - name: zen-flow
    version: "0.0.2-alpha"
    repository: "file://../zen-flow"
    condition: zenFlow.enabled
  - name: zen-gc
    version: "0.0.3-alpha"
    repository: "file://../zen-gc"
    condition: zenGc.enabled
