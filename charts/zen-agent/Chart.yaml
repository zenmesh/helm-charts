apiVersion: v2
name: zen-agent
description: A Helm chart for zen-agent - Zen Mesh Cluster Agent
type: application
version: 0.1.2
appVersion: "0.1.1"

keywords:
  - kubernetes
  - zen-mesh
  - agent
  - cluster
  - saas

home: https://github.com/zenmesh/zen-platform
sources:
  - https://github.com/zenmesh/zen-platform

maintainers:
  - name: Zen Mesh Team
    email: zen@zen-mesh.io

annotations:
  category: Management
  artifacthub.io/changes: |
    - ENROLLMENT_BUNDLE env from enrollment.bundle (base64 only; required for install)
